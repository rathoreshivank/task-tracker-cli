[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker-cli"
version = "1.0.0"
description = "A simple command-line task tracker"
requires-python = ">=3.8"

[project.scripts]
task-cli = "task_cli:main"

[tool.setuptools]
py-modules = ["task_cli"]